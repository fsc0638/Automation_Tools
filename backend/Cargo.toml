[package]
name = "kway-dev-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kway-dev-backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws", "macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
reqwest = { version = "0.12", features = ["json", "stream"] }
git2 = "0.19"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
futures = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
futures-util = "0.3"
rand = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
zip = "2"
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.15", default-features = false }
regex = "1"
# Phase 3 (cross-lingual semantic retrieval). Local ONNX embedder so a
# Chinese question can match English/Python code. Heavy native dep
# (bundled onnxruntime via `ort`); usage is lazy + fail-open so init
# failure silently falls back to lexical retrieval and never blocks.
fastembed = "4"

# Build configuration.
#
# Note: do NOT set [build] target-dir here — it must vary by platform:
#
#   • macOS / Linux: default `./target` is fine.
#
#   • Windows on OneDrive: Smart App Control / AppLocker blocks DLLs
#     and EXEs born under OneDrive-synced paths (Mark-of-the-Web).
#     This manifests as `cargo run` → "os error 4551" or `cargo build`
#     → "can't find crate for `displaydoc`" (proc-macro DLLs that
#     exist on disk but rustc cannot load).
#
#     On Windows, set the env var BEFORE running cargo, e.g.:
#       cmd:        set CARGO_TARGET_DIR=C:\rust-build\kway-backend
#       powershell: $env:CARGO_TARGET_DIR='C:\rust-build\kway-backend'
#
# `install.sh` already exports CARGO_TARGET_DIR=$REPO_ROOT/backend/target,
# so running it on macOS produces a clean build. The previous unconditional
# `target-dir = "C:/rust-build/..."` setting broke cargo on macOS (colon in
# the joined path collided with DYLD_FALLBACK_LIBRARY_PATH separator).

